name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "1"
      DJANGO_AXES_ENABLED: "0"
      DJANGO_SECRET_KEY: ci-only-7h3Pq9vK2mN8xR4sT6wY1zA5bC0dE7fG9jL3uW8k

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Installer les dépendances verrouillées
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Auditer les dépendances
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock

      - name: Analyser statiquement la sécurité
        run: |
          python -m pip install bandit==1.9.4 semgrep==1.172.0
          bandit -q -r config renewals -x renewals/tests.py,renewals/migrations
          semgrep scan --config p/python --config p/django --error --metrics=off --exclude renewals/tests.py --exclude renewals/migrations

      - name: Vérifier Django et les migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tester la configuration de production
        env:
          DJANGO_DEBUG: "0"
          DJANGO_AXES_ENABLED: "1"
          DJANGO_ALLOWED_HOSTS: app.renouvelassur.org,renouvelassur.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.renouvelassur.org,https://renouvelassur.onrender.com
        run: python manage.py check --deploy

      - name: Exécuter les tests
        run: python manage.py test
