services:
  - type: web
    name: renouvelassur
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "15724800"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "1"
      - key: DJANGO_ADMIN_MFA_REQUIRED
        value: "1"
      - key: MAX_IMPORT_FILE_SIZE_BYTES
        value: "10485760"
      - key: MAX_IMPORT_CELL_TEXT_LENGTH
        value: "10000"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "730"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: app.renouvelassur.org,renouvelassur.org,www.renouvelassur.org,renouvelassur.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://app.renouvelassur.org,https://renouvelassur.org,https://www.renouvelassur.org,https://renouvelassur.onrender.com
      - key: DJANGO_CANONICAL_HOST
        value: app.renouvelassur.org
      - key: DJANGO_CANONICAL_REDIRECT_HOSTS
        value: renouvelassur.org,www.renouvelassur.org
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: renouvelassur-backup
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    schedule: "0 2 * * *"
    dockerfilePath: ./ops/backup/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      # Utiliser l’URL Neon directe (non poolée) avec sslmode=require.
      - key: BACKUP_DATABASE_URL
        sync: false
      - key: BACKUP_ENCRYPTION_PASSPHRASE
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        value: ""
      - key: S3_SERVER_SIDE_ENCRYPTION
        value: AES256
      - key: BACKUP_PREFIX
        value: renouvelassur
